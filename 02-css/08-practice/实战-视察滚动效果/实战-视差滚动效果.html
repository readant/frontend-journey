<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>视差滚动效果</title>
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing:border-box;
		}
		html,body {
			/* 和当前屏幕一样大 */
			width: 100%;
			height: 100%;
		}
		section[class^="section"] {
			width: 100%;
			height: 100%;
		}

		.section1{
			background: url("img/春.jpeg") no-repeat fixed center center/cover;
		}
		.section2 {
			background: url("img/夏.jpg") no-repeat fixed center center/cover;
		}
		.section3 {
			background: url("img/秋.jpeg") no-repeat fixed center center/cover;
		}
		.section4 {
			background: url("img/冬.webp") no-repeat fixed center center/cover;
		}
		.content {
			width:100%;
			height:15%;
			background-color: black;
			color:white;
			line-height: 30px;
			font-size: 32px;
			padding: 25px;
			font-family: '华文行楷', sans-serif;
		}

		section[class^="section"] h2 {
			text-align: center;
			font-weight: 400;
			font-size: 100px;
			margin-top: 200px;
			letter-spacing: 10px;
			color: white;
			font-family: '华文行楷', sans-serif;
		}
	</style>
</head>

<body>
	<!-- 第一屏 -->
	 <section class="section1">
		<div class="content">
			<h4> 《赠思源其一·春·林径寻芳》</h4>
			<p>晴光穿叶碎金茵，草色沾衣带露新。</p>
			<p>笑指野花簪鬓角，不知香里暗牵魂。</p>
			<p>	愿君春满前程路，花好月圆福常临。</p>
		</div>
		<h2>春</h2>
	 </section>

	 <section class="section2">
		<div class="content">
			<h4>《赠思源其二·夏·陌上晚晴》</h4>
			<p>禾风漫野接云光，屋角炊烟绕夕阳。</p>
			<p>遥指山边归鹭影，只言夏昼比春长。</p>
			<p>愿君夏凉无暑扰，风调雨顺乐安康。</p>


		</div>
		<h2>夏</h2>
	 </section>

	 	 <section class="section3">
		<div class="content">
			<h4>《赠思源其三·秋·林间迟步》</h4>
			<p>丹叶垂云遮晚径，雾轻如缕绕寒枝。</p>
			<p>相逢不敢多凝睇，只道秋光胜旧时。</p>
			<p>愿君此季多顺遂，霜染流年亦暖滋。</p>


		</div>
		<h2>秋</h2>
	 </section>

	 	 <section class="section4">
		<div class="content">
       <h4>《赠思源其四·冬·雪岸待归》</h4>
      <p>琼枝覆雪接霞天，灯影长街履迹单。</p>
      <p>笑指梅香沾袖角，不知别后忆温言。</p>
      <p>愿君冬暖无寒扰，岁暮安然福寿全。</p>
		</div>
		<h2>冬</h2>
	 </section>

</body>
</html>
